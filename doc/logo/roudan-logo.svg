<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bodyGrad" cx="45%" cy="40%">
      <stop offset="0%" style="stop-color:#FFD6A5"/>
      <stop offset="70%" style="stop-color:#F4A261"/>
      <stop offset="100%" style="stop-color:#E76F51"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E76F51"/>
      <stop offset="100%" style="stop-color:#D62828"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00000033"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 背景圆 -->
  <circle cx="200" cy="195" r="195" fill="#FFF8F0"/>

  <!-- 运动轨迹线（战车滚动感） -->
  <g opacity="0.15" stroke="#E76F51" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M55 250 Q120 280 200 290 Q320 305 370 260"/>
    <path d="M70 270 Q130 300 200 308 Q300 320 355 278"/>
    <path d="M85 288 Q140 315 200 322 Q280 332 340 294"/>
  </g>

  <!-- 地面碎石 -->
  <g opacity="0.3">
    <circle cx="80" cy="310" r="5" fill="#E76F51"/>
    <circle cx="150" cy="325" r="3" fill="#D62828"/>
    <circle cx="260" cy="330" r="4" fill="#E76F51"/>
    <circle cx="340" cy="315" r="3" fill="#D62828"/>
    <circle cx="320" cy="340" r="2" fill="#E76F51"/>
  </g>

  <!-- 旋转风线 -->
  <g opacity="0.4">
    <path d="M102 140 A80 80 0 0 1 298 140" fill="none" stroke="#D62828" stroke-width="3" stroke-dasharray="8 6"/>
    <path d="M115 155 A68 68 0 0 1 285 155" fill="none" stroke="#E76F51" stroke-width="2" stroke-dasharray="6 4"/>
    <!-- 运动气流 -->
    <path d="M320 170 Q350 190 345 230" fill="none" stroke="#D62828" stroke-width="3" stroke-linecap="round"/>
    <path d="M335 175 Q362 195 358 225" fill="none" stroke="#E76F51" stroke-width="2" stroke-linecap="round"/>
    <path d="M80 170 Q50 190 55 230" fill="none" stroke="#D62828" stroke-width="3" stroke-linecap="round"/>
    <path d="M65 175 Q38 195 42 225" fill="none" stroke="#E76F51" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 主体：肉弹球 -->
  <circle cx="200" cy="195" r="95" fill="url(#bodyGrad)" filter="url(#shadow)" stroke="#D62828" stroke-width="2"/>

  <!-- 忍术绷带纹理 -->
  <g opacity="0.12" stroke="#D62828" stroke-width="2">
    <path d="M145 165 Q170 155 200 158 Q230 161 255 165" fill="none"/>
    <path d="M135 185 Q170 175 200 178 Q230 181 265 185" fill="none"/>
    <path d="M140 205 Q170 195 200 198 Q230 201 260 205" fill="none"/>
  </g>

  <!-- 表情：坚毅的豆豆眼 -->
  <circle cx="170" cy="185" r="8" fill="#2D1B0E"/>
  <circle cx="172" cy="183" r="2.5" fill="#fff"/>

  <circle cx="230" cy="185" r="8" fill="#2D1B0E"/>
  <circle cx="232" cy="183" r="2.5" fill="#fff"/>

  <!-- 眉毛（坚毅） -->
  <line x1="160" y1="172" x2="178" y2="175" stroke="#2D1B0E" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="240" y1="175" x2="222" y2="172" stroke="#2D1B0E" stroke-width="3.5" stroke-linecap="round"/>

  <!-- 嘴巴（自信微笑） -->
  <path d="M185 205 Q200 218 215 205" fill="none" stroke="#2D1B0E" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 脸颊红晕 -->
  <ellipse cx="155" cy="200" rx="10" ry="6" fill="#FF6B6B" opacity="0.35"/>
  <ellipse cx="245" cy="200" rx="10" ry="6" fill="#FF6B6B" opacity="0.35"/>

  <!-- 头顶护额/头带 -->
  <rect x="150" y="98" width="100" height="18" rx="4" fill="#D62828"/>
  <rect x="170" y="94" width="60" height="26" rx="6" fill="#E76F51" stroke="#D62828" stroke-width="1.5"/>
  <!-- 护额上 R 标 -->
  <text x="200" y="115" text-anchor="middle" font-family="Arial Black" font-size="16" font-weight="900" fill="#fff">R</text>

  <!-- 左右小手臂（抱膝姿态） -->
  <g>
    <!-- 左手 -->
    <ellipse cx="110" cy="195" rx="22" ry="16" fill="#FFD6A5" stroke="#E76F51" stroke-width="2" transform="rotate(-20, 110, 195)"/>
    <!-- 右手 -->
    <ellipse cx="290" cy="195" rx="22" ry="16" fill="#FFD6A5" stroke="#E76F51" stroke-width="2" transform="rotate(20, 290, 195)"/>
  </g>

  <!-- 标题文字 -->
  <text x="200" y="355" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="38" font-weight="900" fill="url(#textGrad)" filter="url(#glow)">ROUDAN</text>
  <text x="200" y="382" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#D62828" letter-spacing="8" opacity="0.7">肉 弹 战 车</text>
</svg>
